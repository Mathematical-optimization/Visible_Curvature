run:
  name: streaming-decoder-ggn
  seed: 31
  device: cpu
  dtype: float64
  deterministic: true
model:
  family: decoder
  checkpoint: null
  kwargs:
    vocab_size: 12
    max_seq_len: 6
    d_model: 6
    n_heads: 2
    n_layers: 1
    mlp_ratio: 2
    dropout: 0.0
data:
  family: synthetic_language
  num_examples: 6
  batch_size: 2
  kwargs:
    seq_len: 5
    vocab_size: 12
task:
  family: causal_lm
  input_key: input_ids
  target_key: labels
  ignore_index: -100
blocks:
  include:
    - blocks\.0\.q_proj\.weight$
  exclude: []
  min_numel: 2
  max_numel: 128
curvature:
  kind: ggn
  shift: 0.001
  exact_max_dim: 128
  lanczos_steps: 12
  lanczos_starts: 2
  positive_threshold: 1.0e-10
  residual_tolerance: 1.0e-6
  subspace_policy: strict_spd
moments:
  centered: true
  backend: loop
  accumulation_dtype: float64
  max_examples: 4
geometry:
  alpha_values: [0.25, 0.5]
  damping_ratios: [0.0, 0.001, 1.0]
  adam_damping: 1.0e-6
  exact_condition_max_dim: 128
  shampoo_damping_ratio: 0.001
  random_assignment_repeats: 1
streaming:
  curvature_batch_size: 2
  max_factor_elements: 1000000
  run_interventions: true
  assignment_max_dim: 128
output_dir: experiments/outputs
