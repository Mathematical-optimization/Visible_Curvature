[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visible-curvature-experiments"
version = "1.3.0"
description = "Focused frozen causal-LM experiments for optimizer-visible curvature and signed Adam/Shampoo order reversal"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "torch>=2.2",
]

[project.optional-dependencies]
network = ["transformers>=4.40", "datasets>=2.18"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "build>=1.2"]

[tool.setuptools.packages.find]
include = ["visible_curvature*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
